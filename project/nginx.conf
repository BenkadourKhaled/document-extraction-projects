server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Never cache the SPA entry point. A stale index.html keeps referencing an
  # old hashed bundle after a deployment, which makes the browser run stale code.
  location = /index.html {
    expires -1;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to the Spring Boot backend.
  # Adjust the upstream to match your backend host/port.
  location /api/v1/ {
    proxy_pass http://backend:8080/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 50m;
  }

  # Cache static assets
  location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
