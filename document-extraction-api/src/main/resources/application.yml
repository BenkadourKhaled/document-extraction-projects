# ---------------------------------------------------------------------------
# Document Extraction API - configuration par defaut.
# Toutes les valeurs peuvent etre surchargees par variables d'environnement.
# Le profil par defaut est prevu pour un poste de developpement : H2 fichier
# et stockage local. Le profil "postgres" cible PostgreSQL + MinIO/S3.
# ---------------------------------------------------------------------------
server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: document-extraction-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/db/document-extraction;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  servlet:
    multipart:
      enabled: true
      # Limite applicative : 50 Mo par fichier (validation metier egalement
      # effectuee dans ExtractionService pour renvoyer un ProblemDetail 413).
      max-file-size: 50MB
      max-request-size: 51MB
      file-size-threshold: 1MB
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

# Documentation OpenAPI / Swagger UI.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  extraction:
    max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:52428800}
    max-pages: ${MAX_PAGES:50}
    native-text-min-characters: ${NATIVE_TEXT_MIN_CHARACTERS:30}
    pdf-dpi: ${PDF_DPI:300}
    default-languages: ${OCR_DEFAULT_LANGUAGES:fra+eng}
    supported-languages: [fra, eng, ara]
    tesseract-datapath: ${TESSDATA_PREFIX:/usr/share/tesseract-ocr/5/tessdata}
    cache-ttl-hours: ${CACHE_TTL_HOURS:1}
    cache-maximum-size: ${CACHE_MAXIMUM_SIZE:1000}
    async-enabled: ${ASYNC_ENABLED:false}
    async-threshold-bytes: ${ASYNC_THRESHOLD_BYTES:2097152}
    async-threshold-pages: ${ASYNC_THRESHOLD_PAGES:5}
    async-core-pool-size: ${ASYNC_CORE_POOL_SIZE:2}
    async-max-pool-size: ${ASYNC_MAX_POOL_SIZE:4}
    async-queue-capacity: ${ASYNC_QUEUE_CAPACITY:50}
  security:
    jwt:
      # En production, fournir un secret de 32 octets minimum via JWT_SECRET.
      secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
      issuer: ${JWT_ISSUER:document-extraction-api}
      ttl-minutes: ${JWT_TTL_MINUTES:480}
    login-protection:
      # Cinq echecs dans la fenetre bloquent le couple email/IP pendant 15 min.
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      window-minutes: ${LOGIN_WINDOW_MINUTES:15}
      block-minutes: ${LOGIN_BLOCK_MINUTES:15}
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:true}
    organization-name: ${BOOTSTRAP_ORG_NAME:Mon organisation}
    organization-slug: ${BOOTSTRAP_ORG_SLUG:default}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@local.test}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
    admin-display-name: ${BOOTSTRAP_ADMIN_NAME:Administrateur}
  storage:
    type: ${STORAGE_TYPE:local}
    local-path: ${STORAGE_LOCAL_PATH:./data/storage}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:document-extraction}
    secure: ${MINIO_SECURE:false}
  retention:
    default-days: ${RETENTION_DAYS:30}
    purge-enabled: ${RETENTION_PURGE_ENABLED:true}
  queue:
    worker-enabled: ${QUEUE_WORKER_ENABLED:true}
    poll-interval-ms: ${QUEUE_POLL_INTERVAL_MS:1500}
    max-attempts: ${QUEUE_MAX_ATTEMPTS:3}
    worker-id: ${QUEUE_WORKER_ID:worker-local}

logging:
  level:
    root: INFO
    dz.DocuScan.document: INFO
