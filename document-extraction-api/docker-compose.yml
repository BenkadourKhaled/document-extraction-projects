services:
  postgres:
    image: postgres:16-alpine
    container_name: document-extraction-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-document_extraction}
      POSTGRES_USER: ${POSTGRES_USER:-document}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-document} -d ${POSTGRES_DB:-document_extraction}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-elestio/minio:latest}
    container_name: document-extraction-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: ${MINIO_IMAGE:-elestio/minio:latest}
    container_name: document-extraction-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-document-extraction}
    volumes:
      - ./backups:/backups
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      mc anonymous set none local/$$MINIO_BUCKET;
      "
    restart: "no"

  document-extraction-api:
    build: .
    container_name: document-extraction-api
    networks:
      default:
        aliases:
          - backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-document_extraction}
      DATABASE_USERNAME: ${POSTGRES_USER:-document}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ bytes)}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-480}
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED:-true}
      BOOTSTRAP_ORG_NAME: ${BOOTSTRAP_ORG_NAME:-Mon organisation}
      BOOTSTRAP_ORG_SLUG: ${BOOTSTRAP_ORG_SLUG:-default}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrateur}
      STORAGE_TYPE: s3
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-document-extraction}
      MINIO_SECURE: "false"
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:8081}
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../project}
      args:
        VITE_API_URL: /api/v1
    container_name: document-extraction-web
    depends_on:
      document-extraction-api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    restart: unless-stopped

  # Optional TLS reverse proxy. Start with:
  #   docker compose --profile tls up -d
  # Place server.crt and server.key in ./certs first.
  proxy:
    image: nginx:1.27-alpine
    container_name: document-extraction-proxy
    profiles: ["tls"]
    depends_on:
      frontend:
        condition: service_started
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

  # Optional Prometheus scrape endpoint:
  #   docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: document-extraction-prometheus
    profiles: ["monitoring"]
    depends_on:
      document-extraction-api:
        condition: service_healthy
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  prometheus-data:


